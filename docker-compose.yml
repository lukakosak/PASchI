services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paschi}
      MYSQL_USER: ${MYSQL_USER:-paschi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./Implementierung/Backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-paschi}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-paschi}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RSA_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      RSA_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      APP_SEEDADMIN_ENABLED: "true"
      APP_SEEDADMIN_EMAIL: admin@local.test
      APP_SEEDADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    volumes:
      - ./docker/keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./docker/keys/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Implementierung/frontend/paschi/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
    - api
    ports:
    - "8081:80"

volumes:
  mysql-data: